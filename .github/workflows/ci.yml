# ============================================================
# AI Security Guardian — CI/CD Pipeline
# ============================================================
# 触发: push / PR 到 main + 手动触发
# 流程: Lint → Test (matrix Python 3.10/3.11/3.12) → Build Docker
# ============================================================

name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "edge/**"
      - "images/**"
      - "firmware/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "edge/**"
      - "images/**"
      - "firmware/**"
  workflow_dispatch:

# 并发控制: 同一分支上只保留最新的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: 1
  PYTHONDONTWRITEBYTECODE: 1
  POETRY_VERSION: "2.1.2"

# ── Jobs ──────────────────────────────────────────────────────

jobs:

  # =============================================================
  #  Job 1: Lint + Test (矩阵)
  # =============================================================
  test:
    name: "Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 - --version ${{ env.POETRY_VERSION }}
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.local/share/pypoetry
          key: poetry-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          poetry install \
            --without tray,gui,kb \
            --no-interaction \
            --no-ansi

      - name: Ruff Lint
        run: |
          poetry run ruff check . --output-format=github

      - name: Run tests with coverage
        run: |
          poetry run pytest \
            -v \
            --tb=short \
            --cov=agent \
            --cov=pc_agent \
            --cov-report=term-missing \
            --cov-report=xml \
            --timeout=30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          flags: unittests
          name: guardian-coverage
          fail_ci_if_error: false
        continue-on-error: true

  # =============================================================
  #  Job 2: Docker 构建 (测试全部通过后才执行)
  # =============================================================
  build:
    name: "Build Docker Image"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ai-security-guardian:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (--help)
        run: |
          docker run --rm ai-security-guardian:ci-${{ github.sha }} --help

      - name: Smoke test (import check)
        run: |
          docker run --rm ai-security-guardian:ci-${{ github.sha }} \
            python -c "from agent.config import AgentConfig; from agent.core import AgentCore; print('Import OK')"
