[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ai-security-guardian"
version = "2.0.0"
description = "AI 网络安全管家 — Autonomous PC Agent with ESP32 hardware isolation"
authors = ["AI Security Guardian Team"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "agent" },
    { include = "pc_agent" },
]
include = [
    "agent_cli.py",
    "generate_integrity_manifest.py",
    "insert_diagrams.py",
]

# 国内网络加速: 清华 PyPI 镜像 (影响所有 poetry install: 本地/CI/Docker)
[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"

[tool.poetry.scripts]
guardian = "agent_cli:main"
guardian-cli = "agent_cli:main"
guardian-pc = "pc_agent.main:main"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

# 核心通信
pyserial = ">=3.5"
psutil = ">=5.9.0"
pyyaml = ">=6.0"
requests = ">=2.28.0"

# Windows 安全 API
pywin32 = { version = ">=306", markers = "sys_platform == 'win32'" }

# 日志
colorlog = ">=6.7.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-mock = ">=3.10.0"
pytest-timeout = ">=2.0.0"
pytest-cov = ">=4.0.0"
ruff = ">=0.6.0"

# ── 可选依赖组 ──────────────────────────────────────────────

[tool.poetry.group.tray]
optional = true

[tool.poetry.group.tray.dependencies]
pystray = ">=0.19.0"
pillow = ">=10.0.0"

[tool.poetry.group.gui]
optional = true

[tool.poetry.group.gui.dependencies]
PyQt5 = ">=5.15.0"

[tool.poetry.group.kb]
optional = true

[tool.poetry.group.kb.dependencies]
chromadb = ">=0.4.0"
sentence-transformers = ">=2.2.0"

# Poetry 2.x: extras 必须引用具体包名，不能引用组名
# 注: [tool.poetry.extras] 已移除 —— Poetry 2.x 下无法引用可选组依赖，
# 且项目各处均通过 `poetry install --with/--without <组>` 或 pip 安装可选依赖。
# 如需"pip install 包[tray]" 式安装，后续再迁移到 [project.optional-dependencies]。

[tool.poetry.urls]
Homepage = "https://github.com/czypluto/ai-security-guardian"
Repository = "https://github.com/czypluto/ai-security-guardian"

# ── Poetry 自身配置 ──────────────────────────────────────────
[tool.poetry.requires-plugins]
# Poetry 2.x 插件 (如需要)
# poetry-plugin-export = "*"

# ── pytest ────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
timeout = 30

# ── Coverage ──────────────────────────────────────────────────
[tool.coverage.run]
source = ["agent", "pc_agent"]
omit = [
    "tests/*",
    "**/__pycache__/*",
    "**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# ── Ruff / Linter (可选，便于后续接入) ─────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F/W: 语法/真 bug 类; I: 导入排序。
# 注: 不启用 N(命名) —— 会对 ctypes/Windows API/Qt 方法名误报(如 JOBOBJECT_*、eventFilter);
#     不启用 UP(现代化) —— 纯样式改动, 动 30+ 文件无功能收益。
select = ["E", "F", "W", "I"]
ignore = ["E501"]
